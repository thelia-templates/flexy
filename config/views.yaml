# Root templates that are not pages of their own: they render only with the context a
# controller prepares, or exist to be extended. Asking for one by name through the
# front-office catch-all returns a 404 instead of a broken page.
#
# Read by Thelia\Core\Template\InternalViewsDeclaration and enforced in ViewRenderer, so
# only requests naming a view are affected — a controller rendering the same template is not.
internal:
    # Layouts, only ever extended
    - base
    - checkout-base

    # Rendered by the error handler with its own status code and message
    - error
    # Quoted: unquoted, YAML reads it as an integer, and the core rejects a non-string entry.
    - '404'

    # Customer area: the controller checks authentication and resolves the entity
    - account
    - account-order
    - account-orders
    - account-addresses
    - address
    - address-update

    # Registration and password flows, driven by a session or a token
    - customer-activation
    - customer-informations
    - password-forgotten-confirm
    - reset-password-confirm

    # Guest checkout: rendered by a controller that checks the shop setting, the cart and
    # the tracking token. Reachable by name, they would render with no order at all.
    - checkout-identify
    - guest-order
    - guest-account

    # Checkout steps, each guarded by the cart state its controller checks
    - checkout-cart
    - checkout-delivery
    - checkout-payment
    - checkout-confirm
    - checkout-failed
    - checkout-gateway

    # XML fragments assembled by SitemapGenerator
    - sitemap-index
    - sitemap-urlset
    - sitemap-images
