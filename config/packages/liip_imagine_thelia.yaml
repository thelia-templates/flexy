# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
  # valid drivers options include "gd" or "gmagick" or "imagick"
  driver: 'gd'
  # WebP negotiation is off on purpose. With `webp.generate` enabled, CacheManager's
  # getBrowserPath() short-circuits its isStored() check and emits a
  # /media/cache/resolve/... URL for EVERY image, forever — the Accept negotiation
  # happens in the resolve controller, per request. Each resolve is a full framework
  # boot answered with a redirect the browser is forbidden to cache
  # (Cache-Control: private, max-age=0), so a listing page re-pays dozens of PHP
  # boots on every view. Off, an image resolves to its direct /media/cache/... URL
  # once generated and the web server serves it with long-lived caching. The WebP
  # saving was small at these sizes (thumbnails, quality 80-82); if it is ever
  # wanted back, serve the variant through <picture><source type="image/webp">
  # with direct URLs instead of per-request negotiation. No global `format`
  # conversion either: it would rewrite the base image too.
  webp:
    generate: false
  loaders:
    default:
      filesystem:
        data_root:
            - '%kernel.project_dir%/local/media/images'
            - '%kernel.project_dir%/local/library/images'
        # Allow the loader to boot before TheliaLibrary (which creates the folder)
        # has run its preActivation. Missing paths fall through to a regular 404
        # when the image is requested.
        allow_unresolvable_data_roots: true

  filter_sets:
    default:
    add_to_cart:
    # 72px thumbnails: the empty set would serve the full-size original, the very
    # cost the product_gallery note below describes.
    order_card:
      filters:
        thumbnail: { size: [144, 144], mode: inset }
    # `inset`, not `outbound`: the card CSS pairs it with object-fit: contain.
    # Measured 2026-08-10: outbound upscales every source to fill the box exactly, so it
    # ships MORE bytes than inset (up to +113% on the demo catalogue), the opposite of
    # the intuition. Careful with the legacy URLs these replaced (%5E*!386,280): the `*`
    # padded the visual onto a fixed canvas, so `cover` cropped nothing but that white
    # margin. `inset` does not pad, hence the `contain` on the box.
    product_card:
      filters:
        thumbnail: { size: [386, 280], mode: inset }
    order_card_detail:
      filters:
        thumbnail: { size: [224, 224], mode: inset }
    # Search suggestion row: 97px box in the mockup, served at 2x
    search_card:
      filters:
        thumbnail: { size: [194, 194], mode: inset }
    similar_content_default:
      filters:
        thumbnail: { size: [196, 196], mode: outbound }
    # Product visuals are never cropped: `inset` fits them in the box and keeps their ratio.
    # The source served both the rail and the main visual through the unresized `default` set,
    # which downloaded every full-size image again for a 54px-wide thumbnail.
    product_gallery:
      filters:
        thumbnail: { size: [1188, 920], mode: inset }
    product_gallery_thumbnail:
      filters:
        thumbnail: { size: [160, 160], mode: inset }
    article_card:
      filters:
        thumbnail: { size: [480, 320], mode: outbound }
    subheader_item_sm:
      filters:
        thumbnail: { size: [800, 450], mode: outbound }
    subheader_item_md:
      filters:
        thumbnail: { size: [400, 450], mode: outbound }
    subheader_item_lg:
      filters:
        thumbnail: { size: [500, 450], mode: outbound }
    subheader_item_xl:
      filters:
        thumbnail: { size: [900, 500], mode: outbound }
    # CategoryCard, served through a <picture> so a phone never downloads the desktop file.
    category:
      quality: 82
      filters:
        downscale:
          max: [500, 500]
    category_md:
      quality: 80
      filters:
        downscale:
          max: [400, 400]
    category_sm:
      quality: 80
      filters:
        downscale:
          max: [300, 300]
    # Brand logo in the brand page heading, capped at the 80px box the heading gives it,
    # served at 2x. `downscale`, not `thumbnail`: a logo smaller than the box is left alone
    # instead of being blown up.
    brand_logo:
      quality: 82
      filters:
        downscale:
          max: [320, 160]
    # Images referenced by sitemap-images.xml. No `format` here on purpose: the theme serves
    # WebP through content negotiation and keeps the source format as the fallback.
    sitemap:
      quality: 82
      filters:
        downscale:
          max: [800, 800]
